<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Quiz — Play</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; justify-content:center;
         gap:16px; padding:22px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:#0d1117; color:#e6edf3; }
  h1 { font-size:22px; margin:0; line-height:1.25; }
  p.sub { margin:0; color:#8b949e; font-size:15px; line-height:1.4; }
  input { width:100%; padding:16px; font-size:18px; border-radius:14px;
          border:1px solid #30363d; background:#161b22; color:#e6edf3; }
  button.go { padding:18px; font-size:19px; font-weight:700; border:none; border-radius:14px;
              background:#238636; color:#fff; cursor:pointer; width:100%; }
  button.go:disabled { opacity:.5; }
  .qimg { display:block; width:100%; max-height:34vh; object-fit:contain;
          border-radius:14px; margin:0 0 4px; border:1px solid #21262d; background:#161b22; }
  .tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .tile { display:flex; align-items:center; gap:10px; padding:20px 16px; border-radius:16px;
          font-size:18px; font-weight:700; color:#fff; border:none; cursor:pointer;
          min-height:88px; text-align:left; transition:opacity .2s, transform .1s; }
  .tile:active { transform:scale(.97); }
  .tile .letter { font-size:1.3em; font-weight:800; opacity:.85; }
  .tile .txt { flex:1 1 auto; word-break:break-word; }
  .tile .optimg { flex:1 1 auto; min-width:0; max-width:100%; max-height:17vh; object-fit:contain;
                  background:#fff; border-radius:10px; }
  .card .optimg { display:block; margin:10px auto 0; max-width:70%; max-height:22vh;
                  background:#fff; border-radius:10px; }
  .c0 { background:#e23b4d; } .c1 { background:#1f6feb; }
  .c2 { background:#d9a420; } .c3 { background:#2ea043; }
  .tile.dim { opacity:.35; } .tile.picked { outline:4px solid #fff; }
  .tile:disabled { cursor:default; }
  .card { background:#161b22; border:1px solid #21262d; border-radius:16px; padding:26px 22px;
          text-align:center; }
  .big { font-size:24px; font-weight:800; margin:0 0 8px; }
  .right { color:#3fb950; } .wrong { color:#f85149; }
  .score { font-size:34px; font-weight:800; color:#58a6ff; margin:10px 0 0; }
  .muted { color:#8b949e; font-size:15px; }
  .err { color:#f85149; font-size:15px; line-height:1.5; }
  .you { color:#8b949e; font-size:14px; text-align:center; }
  .ptimer { display:flex; align-items:center; gap:10px; }
  .ptimer .secs { font-size:26px; font-weight:800; min-width:40px; font-variant-numeric:tabular-nums; }
  .ptimer .tbar { flex:1; height:10px; background:#21262d; border-radius:5px; overflow:hidden; }
  .ptimer .tbar i { display:block; height:100%; width:100%; background:#1f6feb; transition:width .2s linear; }
  .ptimer.low .secs { color:#f85149; } .ptimer.low .tbar i { background:#f85149; }
  .fineprint { color:#6e7681; font-size:13px; line-height:1.5; text-align:center; }
</style>
</head>
<body>
  <div id="root"><div class="muted">Loading…</div></div>

<script type="module">
  import { db, requireAuth } from "./app.js";
  import { ref, set, get, onValue, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const id = new URLSearchParams(location.search).get("quiz");
  const root = document.getElementById("root");
  const LETTERS = ["A", "B", "C", "D"];

  const base = "quizzes/" + id;
  const nameKey = "quizname_" + id;   // remembered nickname, so a rejoin is seamless

  // myId is this device's anonymous Firebase uid. It is not linked to anything
  // — no email, no login, no student record — and the security rules use it to
  // scope reads and writes to this player alone.
  let config = null, state = null, myId = null, myName = null;
  let locked = false, myChoice = null, myRank = null, myScore = 0;
  let serverOffset = 0, timeUp = false;   // countdown mirrors the host's (server clock)

  start();

  async function start() {
    const user = await requireAuth();
    if (!user) return;
    myId = user.uid;
    if (!id) {
      root.innerHTML = '<div class="err">No quiz specified. Scan the QR on the screen.</div>';
      return;
    }
    const snap = await get(ref(db, base + "/config"));
    config = snap.val();
    if (!config) { root.innerHTML = '<div class="err">Quiz not found.</div>'; return; }

    myName = localStorage.getItem(nameKey);
    if (!myName) renderName();
    listen();
  }

  // Seconds left on the current question, or null if there's no timer.
  function secondsLeft() {
    if (!state || state.phase !== "question" || typeof state.startedAt !== "number" || !state.limit) return null;
    return Math.max(0, state.limit - (Date.now() + serverOffset - state.startedAt) / 1000);
  }
  function tick() {
    const left = secondsLeft();
    if (left === null) return;
    const secs = document.getElementById("psecs"), bar = document.getElementById("pbar");
    if (secs) secs.textContent = Math.ceil(left);
    if (bar) bar.style.width = (left / state.limit * 100) + "%";
    const box = document.getElementById("ptimer");
    if (box) box.classList.toggle("low", left <= 5);
    if (left <= 0 && !timeUp) { timeUp = true; if (!locked) render(); }
  }

  function listen() {
    onValue(ref(db, ".info/serverTimeOffset"), (s) => { serverOffset = s.val() || 0; });
    setInterval(tick, 200);
    onValue(ref(db, base + "/state"), async (s) => {
      const prevKey = state ? state.q + "@" + state.startedAt : "";
      state = s.val();
      if (!state || state.q + "@" + state.startedAt !== prevKey) timeUp = false;
      const phase = state ? state.phase : "lobby";
      // The host erases the roster at the end of a game. Re-claim our slot any
      // other time, so a mid-game reset or a reconnect doesn't drop us out.
      if (phase !== "done" && myName) await ensureRegistered();
      if (phase === "question" || phase === "reveal") await syncAnswer(state.q);
      if (phase === "reveal" || phase === "leaderboard") await syncMe();
      render();
    });
  }

  async function ensureRegistered() {
    const me = await get(ref(db, base + "/players/" + myId + "/name"));
    if (!me.exists()) await registerWith(myName);
  }

  // Read back our own answer rather than trusting localStorage: the rules make
  // answers write-once server-side, so this is the real state of things and it
  // survives a refresh or a dead battery.
  async function syncAnswer(qi) {
    const a = await get(ref(db, base + "/answers/" + qi + "/" + myId));
    locked = a.exists();
    myChoice = locked ? a.val().choice : null;
  }

  async function syncMe() {
    const me = await get(ref(db, base + "/players/" + myId));
    const v = me.exists() ? me.val() : {};
    myScore = typeof v.score === "number" ? v.score : 0;
    myRank = typeof v.rank === "number" ? v.rank : null;
  }

  // ---- name / registration ----
  function renderName() {
    root.innerHTML =
      '<h1>' + esc(config.title || "Quiz") + '</h1>' +
      '<p class="sub">Pick a name for the leaderboard — real or made up, whatever you like.</p>' +
      '<input id="nm" placeholder="Name" autocomplete="off" maxlength="20" autofocus>' +
      '<button class="go" id="join" style="margin-top:6px">Join</button>' +
      '<div class="err" id="nerr"></div>' +
      '<p class="fineprint">Just a game — nothing here is graded or recorded. Your nickname ' +
        'is erased from the database when the game ends.</p>';
    const input = document.getElementById("nm");
    const btn = document.getElementById("join");
    if (myName) input.value = myName;
    async function join() {
      const v = input.value.trim();
      if (!v) { input.focus(); return; }
      btn.disabled = true;
      try { await registerWith(v); render(); }
      catch (e) { document.getElementById("nerr").textContent = "Couldn't join: " + e.message; btn.disabled = false; }
    }
    btn.onclick = join;
    input.addEventListener("keydown", e => { if (e.key === "Enter") join(); });
  }

  // A player writes exactly one thing about themselves: their nickname. Score,
  // rank, and awarded points are host-written and rejected from here.
  async function registerWith(name) {
    await set(ref(db, base + "/players/" + myId + "/name"), name);
    myName = name;
    localStorage.setItem(nameKey, name);
  }

  // ---- main render by phase ----
  function render() {
    const phase = state ? state.phase : "lobby";
    if (phase === "done") return renderFinal();
    // Don't re-paint the join form over a half-typed nickname.
    if (!myName) { if (!document.getElementById("nm")) renderName(); return; }
    if (phase === "lobby" || !state) return renderLobby();
    if (phase === "question") return renderQuestion();
    if (phase === "reveal")   return renderReveal();
    if (phase === "leaderboard") return renderRank();
  }

  function youLine() { return '<div class="you">Playing as <b>' + esc(myName) + '</b></div>'; }

  function renderLobby() {
    root.innerHTML =
      '<div class="card">' +
        '<p class="big">You\'re in! 🎉</p>' +
        '<p class="muted">Waiting for the host to start…</p>' +
      '</div>' + youLine();
  }

  function renderQuestion() {
    const qi = state.q;
    const q = config.questions[qi];
    if (!q) { root.innerHTML = '<div class="muted">Waiting…</div>'; return; }

    if (locked) {
      root.innerHTML =
        '<div class="card">' +
          '<p class="big">Answer locked ✓</p>' +
          '<p class="muted">' + (myChoice != null ? "You picked " + LETTERS[myChoice] : "") + ' — waiting for others…</p>' +
        '</div>' + youLine();
      return;
    }

    const left = secondsLeft();
    if (left !== null && left <= 0) {
      root.innerHTML =
        '<div class="card"><p class="big">Time\'s up ⏰</p>' +
        '<p class="muted">No answer this round. Watch the screen for the answer.</p></div>' + youLine();
      return;
    }
    const timer = left === null ? '' :
      '<div class="ptimer" id="ptimer"><span class="secs" id="psecs">' + Math.ceil(left) +
      '</span><div class="tbar"><i id="pbar" style="width:' + (left / state.limit * 100) + '%"></i></div></div>';

    const tiles = q.options.map((opt, i) =>
      '<button class="tile c' + i + '" data-i="' + i + '">' +
        '<span class="letter">' + LETTERS[i] + '</span>' +
        optHTML(opt) +
      '</button>').join("");
    root.innerHTML =
      timer +
      '<h1>Q' + (qi + 1) + '. ' + esc(q.q) + '</h1>' +
      (q.image ? '<img class="qimg" src="' + esc(q.image) + '" alt="">' : '') +
      '<p class="sub">Tap your answer.</p>' +
      '<div class="tiles">' + tiles + '</div>' + youLine();

    root.querySelectorAll(".tile").forEach(b => {
      b.onclick = () => submitAnswer(qi, Number(b.dataset.i));
    });
  }

  async function submitAnswer(qi, choice) {
    if (locked) return;
    const left = secondsLeft();
    if (left !== null && left <= 0) { render(); return; }   // too late
    locked = true; myChoice = choice;
    render();                               // lock the UI immediately
    try {
      // serverTimestamp() is required by the rules, so the speed bonus is
      // measured by Firebase's clock, not by anything this phone claims.
      await set(ref(db, base + "/answers/" + qi + "/" + myId),
                { choice, ts: serverTimestamp() });
    } catch (e) {
      // Either we already answered (write-once) or the write was rejected.
      await syncAnswer(qi);
      if (!locked) {
        root.innerHTML = '<div class="err">Couldn\'t send: ' + esc(e.message) + '. Tap to retry.</div>';
        setTimeout(render, 1200);
        return;
      }
    }
    render();
  }

  // The correct index arrives in state.correct, published by the host at reveal
  // time. It is not in the quiz config this phone downloaded.
  function renderReveal() {
    const qi = state.q;
    const q = config.questions[qi];
    const answer = typeof state.correct === "number" ? state.correct : null;

    let body;
    if (answer === null) {
      body = '<p class="big muted">Answer coming up…</p>';
    } else if (myChoice == null) {
      body = '<p class="big muted">No answer this round</p>' +
             '<p class="muted">Correct was ' + LETTERS[answer] + ': ' + optLabel(q.options[answer]) + '</p>' + optPic(q.options[answer]);
    } else if (myChoice === answer) {
      body = '<p class="big right">Correct! ✓</p>' +
             '<p class="muted">' + LETTERS[answer] + ': ' + optLabel(q.options[answer]) + '</p>' + optPic(q.options[answer]);
    } else {
      body = '<p class="big wrong">Not quite ✗</p>' +
             '<p class="muted">You picked ' + LETTERS[myChoice] + '. Correct was ' +
             LETTERS[answer] + ': ' + optLabel(q.options[answer]) + '</p>' + optPic(q.options[answer]);
    }
    root.innerHTML =
      '<div class="card">' + body + '<div class="score">' + myScore + ' pts</div></div>' + youLine();
  }

  // Rank is written to our own record by the host. We never read the roster —
  // the rules wouldn't allow it, and we don't need to.
  function renderRank() {
    const total = state && typeof state.count === "number" ? state.count : null;
    root.innerHTML = rankCard("Leaderboard", myRank, myScore, total, false) + youLine();
  }

  function renderFinal() {
    const r = state && state.results ? state.results[myId] : null;
    const rank = r && typeof r.rank === "number" ? r.rank : myRank;
    const score = r && typeof r.score === "number" ? r.score : myScore;
    const total = state && typeof state.count === "number" ? state.count : null;
    root.innerHTML = rankCard("🏁 Final", rank, score, total, true) +
      '<p class="fineprint">Game over — your nickname and answers have been erased.</p>';
  }

  function rankCard(heading, rank, score, total, done) {
    const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : (rank ? "#" + rank : "—");
    return '<div class="card">' +
      '<p class="big">' + heading + '</p>' +
      '<p class="big">' + medal + '</p>' +
      '<p class="muted">' + (rank ? ("Rank " + rank + (total ? " of " + total : "")) : "Not ranked") + '</p>' +
      '<div class="score">' + score + ' pts</div>' +
      (done && rank === 1 ? '<p class="muted">You won! 🎉</p>' : '') +
      (!done ? '<p class="muted" style="margin-top:10px">Next question coming up…</p>' : '') +
    '</div>';
  }

  // An option is a string, or {image, text?} for a picture answer.
  function optHTML(opt) {
    if (opt && typeof opt === "object" && opt.image)
      return '<img class="optimg" src="' + esc(opt.image) + '" alt="' + esc(opt.text || "") + '">' +
             (opt.text ? '<span class="txt">' + esc(opt.text) + '</span>' : '');
    return '<span class="txt">' + esc(opt) + '</span>';
  }
  // Reveal line: text answers print as before; picture answers add the picture.
  function isPic(opt) { return !!(opt && typeof opt === "object" && opt.image); }
  function optLabel(opt) { return isPic(opt) ? esc(opt.text || "") : esc(opt); }
  function optPic(opt) {
    return isPic(opt) ? '<img class="optimg" src="' + esc(opt.image) + '" alt="">' : '';
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
