<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Debate</title>
<style>
  :root { color-scheme: dark; --pro:#2ea043; --anti:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; padding:18px 16px 40px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:#0d1117; color:#e6edf3; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:21px; margin:0; line-height:1.25; }
  .sub { margin:0; color:#8b949e; font-size:14px; }
  .sides { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .side { padding:22px 10px; font-size:20px; font-weight:800; border-radius:14px; border:2px solid #30363d;
          background:#161b22; color:#e6edf3; cursor:pointer; }
  .side.p { border-color:var(--pro); } .side.a { border-color:var(--anti); }
  .side.p.on { background:var(--pro); } .side.a.on { background:var(--anti); }
  textarea { width:100%; min-height:96px; padding:14px; font-size:17px; border-radius:14px;
             border:1px solid #30363d; background:#161b22; color:#e6edf3; resize:vertical; }
  .send { width:100%; padding:16px; font-size:18px; font-weight:700; border:none; border-radius:14px; color:#fff; cursor:pointer; }
  .send:disabled { opacity:.5; }
  .ok { color:#3fb950; font-size:15px; min-height:20px; text-align:center; }
  .feedhead { font-weight:700; color:#8b949e; font-size:14px; margin-top:6px; }
  .feed { display:flex; flex-direction:column; gap:10px; }
  .msg { background:#161b22; border:1px solid #30363d; border-radius:14px; padding:12px 14px; font-size:16px;
         line-height:1.35; word-break:break-word; animation:pop .3s; }
  .msg.p { border-left:5px solid var(--pro); } .msg.a { border-left:5px solid var(--anti); }
  .tag { font-size:11px; font-weight:800; letter-spacing:.06em; margin-bottom:4px; }
  .msg.p .tag { color:var(--pro); } .msg.a .tag { color:var(--anti); }
  .rx { display:flex; gap:8px; margin-top:8px; }
  .rx button { background:#21262d; border:1px solid #30363d; color:#e6edf3; border-radius:999px; padding:6px 10px;
               font-size:16px; cursor:pointer; }
  .rx button.mine { border-color:#d29922; background:#3b2e0a; }
  .rx button.boom { animation:boom .35s; }
  @keyframes boom { 50%{transform:scale(1.5);} }
  @keyframes pop { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }
  .err { color:#f85149; }
</style>
</head>
<body>
  <h1 id="question">Loading…</h1>
  <p class="sub" id="sub">Pick your side.</p>
  <div class="sides"><button class="side p" id="sp">PRO</button><button class="side a" id="sa">ANTI</button></div>
  <div id="compose" hidden>
    <textarea id="text" maxlength="280" placeholder="Your best argument…"></textarea>
    <button class="send" id="send" style="margin-top:10px">Post</button>
    <div class="ok" id="ok"></div>
  </div>
  <div class="feedhead">Live feed: tap an emoji to react (both sides)</div>
  <div class="feed" id="feed"></div>

<script type="module">
  import { db, pollId, requireAuth } from "./app.js";
  import { ref, push, onValue, onChildAdded, onChildRemoved, query, limitToLast, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const EMO = ["👍", "🔥", "😂", "🤯"];
  const id = pollId();
  const store = (k, v) => { try { v === undefined ? 0 : localStorage.setItem(k, v); return localStorage.getItem(k); } catch { return null; } };
  let side = store("debate_side_" + id);
  const posts = {};
  const pending = {};
  let labels = ["PRO", "ANTI"];

  start();
  async function start() {
    if (!(await requireAuth())) return;
    if (!id) { document.body.innerHTML = '<p class="err">No debate specified. Scan the QR on the screen.</p>'; return; }
    onValue(ref(db, "polls/" + id + "/config"), (snap) => {
      const cfg = snap.val();
      if (!cfg) { document.body.innerHTML = '<p class="err">Debate not found.</p>'; return; }
      document.getElementById("question").textContent = cfg.question;
      labels = cfg.options || labels;
      document.getElementById("sp").textContent = labels[0];
      document.getElementById("sa").textContent = labels[1];
      showSide();
    }, { onlyOnce: true });

    document.getElementById("sp").onclick = () => { side = store("debate_side_" + id, "0"); showSide(); };
    document.getElementById("sa").onclick = () => { side = store("debate_side_" + id, "1"); showSide(); };
    const btn = document.getElementById("send"), text = document.getElementById("text"), ok = document.getElementById("ok");
    btn.onclick = async () => {
      const v = text.value.trim(); if (!v || side === null) return;
      btn.disabled = true;
      try { await push(ref(db, "polls/" + id + "/responses"), { text: v, choice: Number(side), ts: serverTimestamp() });
            text.value = ""; ok.textContent = "✓ Posted! Add another, or react below."; }
      catch (e) { ok.textContent = "Couldn't post: " + e.message; }
      finally { btn.disabled = false; }
    };

    const r = ref(db, "polls/" + id + "/responses");
    onChildAdded(query(r, limitToLast(600)), (snap) => {
      const m = snap.val(); if (!m || typeof m.choice !== "number") return;
      if (m.choice < 10) addPost(snap.key, m); else addReact(m.text, m.choice - 10);
    });
    onChildRemoved(r, () => location.reload());
  }

  function showSide() {
    const s = side;
    document.getElementById("sp").classList.toggle("on", s === "0");
    document.getElementById("sa").classList.toggle("on", s === "1");
    document.getElementById("compose").hidden = s === null;
    document.getElementById("sub").textContent = s === null ? "Pick your side." :
      "You're on team " + labels[Number(s)] + ". Tap the other button to switch.";
    const btn = document.getElementById("send");
    btn.style.background = s === "1" ? "var(--anti)" : "var(--pro)";
  }

  function addPost(key, m) {
    const sd = m.choice === 0 ? 0 : 1;
    const el = document.createElement("div"); el.className = "msg " + (sd ? "a" : "p");
    const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = labels[sd];
    const t = document.createElement("div"); t.textContent = m.text;
    const rx = document.createElement("div"); rx.className = "rx";
    const counts = [0, 0, 0, 0], btns = [];
    EMO.forEach((e, i) => {
      const b = document.createElement("button");
      const mineKey = "rx_" + id + "_" + key + "_" + i;
      if (store(mineKey)) b.classList.add("mine");
      b.onclick = async () => {
        if (store(mineKey)) return;          // one of each emoji per post
        store(mineKey, "1"); b.classList.add("mine", "boom");
        try { await push(ref(db, "polls/" + id + "/responses"), { text: key, choice: 10 + i, ts: serverTimestamp() }); }
        catch (err) { try { localStorage.removeItem(mineKey); } catch {} b.classList.remove("mine"); }
      };
      btns.push(b); rx.appendChild(b);
    });
    el.append(tag, t, rx);
    document.getElementById("feed").prepend(el);
    posts[key] = { counts, btns };
    render(key);
    (pending[key] || []).forEach(i => addReact(key, i)); delete pending[key];
  }

  function addReact(key, i) {
    if (i < 0 || i >= EMO.length) return;
    const p = posts[key];
    if (!p) { (pending[key] = pending[key] || []).push(i); return; }
    p.counts[i]++; render(key);
  }

  function render(key) {
    const p = posts[key];
    p.btns.forEach((b, i) => { b.textContent = EMO[i] + (p.counts[i] ? " " + p.counts[i] : ""); });
  }
</script>
</body>
</html>
